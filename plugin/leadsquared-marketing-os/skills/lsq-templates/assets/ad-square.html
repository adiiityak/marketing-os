<title>Ad 1200x1200 | LeadSquared</title>
<!--
  LeadSquared static ad, 1200x1200 (LinkedIn / Meta feed). Poppins. Render to PNG at exactly 1200x1200.
  Theme: class "light" or "dark" on .ad. Industry: data-industry on .ad (education | healthcare | lending | home).
  Logo: colored on light, white on dark. Never recolor it. Headline under about 8 words. Text under about 20% of area.
  Swap .visual for a product screenshot or Higgsfield image (no logo or text inside generated images).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:#ccc; }
  .ad { --brand:#0040DF; --ind:#106DFD; --ind-dark:#020B1A; --ind-tint:#E4F0FF;
        width:1200px; height:1200px; position:relative; overflow:hidden; font-family:"Poppins",Arial,sans-serif;
        display:flex; flex-direction:column; padding:80px; }
  .ad[data-industry="healthcare"] { --ind:#3D8181; --ind-dark:#193636; --ind-tint:#F4ECD4; }
  .ad[data-industry="lending"]    { --ind:#277627; --ind-dark:#0D1309; --ind-tint:#F1F8EC; }
  .ad[data-industry="home"]       { --ind:#0040DF; --ind-dark:#07021B; --ind-tint:#ECEBF3; }
  .ad.light { background:#fff; color:#170F49; }
  .ad.dark  { background:var(--ind-dark); color:#fff; }
  .logo { height:52px; width:auto; align-self:flex-start; }
  .ad.light .logo-w, .ad.dark .logo-c { display:none; }
  .eyebrow { margin-top:72px; font-size:26px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ind); }
  .ad.dark .eyebrow { color:color-mix(in srgb, var(--ind) 50%, #fff); }
  h1 { margin-top:20px; font-size:80px; line-height:1.08; font-weight:700; letter-spacing:-.02em; max-width:960px; }
  .sub { margin-top:28px; font-size:34px; line-height:1.4; font-weight:400; max-width:900px; opacity:.85; }
  .visual { margin-top:auto; height:360px; border-radius:24px; background:var(--ind-tint); display:grid; place-items:center;
            font-size:26px; color:#4B5165; }
  .ad.dark .visual { background:rgba(255,255,255,.08); color:#C9D2E3; border:2px solid rgba(255,255,255,.14); }
  .cta { margin-top:40px; align-self:flex-start; background:var(--brand); color:#fff; font-size:30px; font-weight:600;
         padding:22px 40px; border-radius:14px; }
</style>
